[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gbsdconv"
version = "0.2.0"
description = "GUI for the bsdconv encoding converter"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["QPUIQ[pyside6]>=1.3", "bsdconv>=11.7.0"]

[project.scripts]
gbsdconv = "src.app:main"

[tool.setuptools]
packages = ["src", "src.views"]
py-modules = ["bsdconvs", "taglib"]

[tool.setuptools.package-data]
src = ["assets/*.png"]
